APP_NAME = Aegis Sovereign Git Forge
RUN_USER = git
RUN_MODE = prod

[server]
PROTOCOL = http
DOMAIN = localhost
HTTP_PORT = 3000
ROOT_URL = http://localhost:3000/
SSH_PORT = 2222
START_SSH_SERVER = true
OFFLINE_MODE = true
DISABLE_SSH = false

[database]
DB_TYPE = sqlite3
PATH = /mnt/external_1tb/gitea-data/gitea.db

[repository]
ROOT = /mnt/external_1tb/gitea-data/repositories
MAX_CREATION_LIMIT = -1

[repository.upload]
ENABLED = true
TEMP_PATH = /mnt/external_1tb/gitea-data/tmp/uploads
ALLOWED_TYPES = *
FILE_MAX_SIZE = 102400
MAX_FILES = 50

[lfs]
PATH = /mnt/external_1tb/gitea-data/lfs
STORAGE_TYPE = local

[attachment]
ENABLED = true
PATH = /mnt/external_1tb/gitea-data/attachments
MAX_SIZE = 102400
MAX_FILES = 50

[service]
DISABLE_REGISTRATION = false
ALLOW_ONLY_EXTERNAL_REGISTRATION = false
ENABLE_CAPTCHA = false
REQUIRE_SIGNIN_VIEW = false

[security]
INSTALL_LOCK = true
SECRET_KEY = aegis-homelab-sovereign-secret-token

[user]
RESERVED_USERNAMES = 

[log]
MODE = console
LEVEL = Info
